name: Integração contínua
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar artefato
        run: npm run build
      - name: Executar testes
        run: npm test
      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: dist/
